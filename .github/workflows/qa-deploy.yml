name: QA — Deploy to QA (manual)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy to QA
        required: true
        default: main

env:
  GCP_REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  GCP_REPO: atreyu

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Backend → Cloud Run QA
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Capture checkout SHA
        id: sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push backend image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_REPO }}/backend:qa-${{ steps.sha.outputs.value }}
        run: |
          docker build -t "$IMAGE" -f docker/backend/Dockerfile code/backend
          docker push "$IMAGE"

      - name: Deploy to Cloud Run QA
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: atreyu-backend-qa
          region: ${{ env.GCP_REGION }}
          image: ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_REPO }}/backend:qa-${{ steps.sha.outputs.value }}
          flags: --allow-unauthenticated
          env_vars: |
            SPRING_PROFILES_ACTIVE=qa
            SPRING_DATASOURCE_URL=${{ secrets.QA_DB_URL }}
            SPRING_DATASOURCE_USERNAME=${{ secrets.QA_DB_USERNAME }}
            SPRING_DATASOURCE_PASSWORD=${{ secrets.QA_DB_PASSWORD }}

  # ── Frontend ───────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Frontend → Cloud Run QA
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Capture checkout SHA
        id: sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push frontend image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_REPO }}/frontend:qa-${{ steps.sha.outputs.value }}
        run: |
          docker build -t "$IMAGE" -f docker/frontend/Dockerfile .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run QA
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: atreyu-frontend-qa
          region: ${{ env.GCP_REGION }}
          image: ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_REPO }}/frontend:qa-${{ steps.sha.outputs.value }}
          flags: --port=80 --allow-unauthenticated
