name: CD — Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: cd-prod
  cancel-in-progress: false

env:
  GCP_REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  GCP_REPO: atreyu

jobs:
  # ── CI Gate — Backend ──────────────────────────────────────────────────────
  ci-backend:
    name: Backend — lint + test + sonar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required by SonarCloud for blame info

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Lint (Checkstyle)
        working-directory: code/backend
        run: ./mvnw checkstyle:check -q

      - name: Unit tests + coverage + SonarCloud
        working-directory: code/backend
        run: |
          ./mvnw verify sonar:sonar \
            -Dsonar.organization=pakodiazdev-1 \
            -Dsonar.projectKey=atreyu-library-backend \
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_BACKEND }}
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── CI Gate — Frontend ─────────────────────────────────────────────────────
  ci-frontend:
    name: Frontend — lint + typecheck + test + sonar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required by SonarCloud

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json

      - name: Install dependencies
        working-directory: code/frontend
        run: npm ci

      - name: Lint
        working-directory: code/frontend
        run: npm run lint

      - name: Typecheck
        working-directory: code/frontend
        run: npm run typecheck

      - name: Unit tests + coverage
        working-directory: code/frontend
        run: npm test -- --configuration=ci --no-watch

      - name: SonarCloud analysis
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: code/frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONTEND }}
          SONAR_HOST_URL: https://sonarcloud.io

  # ── E2E Gate ───────────────────────────────────────────────────────────────
  e2e:
    name: E2E — Cypress
    runs-on: ubuntu-latest
    needs: [ci-backend, ci-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json

      - name: Install dependencies
        working-directory: code/frontend
        run: npm ci

      - name: Preparar .env.e2e y exportar variables al job
        run: |
          cp .env.e2e.example .env.e2e
          grep -v '^#' .env.e2e | grep -v '^$' >> $GITHUB_ENV

      - name: Levantar stack E2E completo (postgres + backend + frontend)
        run: docker compose --env-file .env.e2e -f docker-compose.e2e.yml up -d --build

      - name: Esperar stack E2E listo
        run: |
          BPORT=${E2E_BACKEND_PORT:-8081}
          FPORT=${E2E_FRONTEND_PORT:-4200}
          MAX=60
          i=0
          until curl -sf http://localhost:$BPORT/api/v1/books | grep -q '\['; do
            i=$((i+1))
            if [ $i -ge $MAX ]; then
              echo "❌ Backend no listo tras $((MAX*3))s — logs:"
              docker compose --env-file .env.e2e -f docker-compose.e2e.yml logs backend_e2e
              exit 1
            fi
            sleep 3
          done
          COUNT=$(curl -sf http://localhost:$BPORT/api/v1/books | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          echo "✅ Backend listo — $COUNT libros en localhost:$BPORT"
          i=0
          until curl -sf http://localhost:$FPORT | grep -qi 'atreyu\|html'; do
            i=$((i+1))
            if [ $i -ge $MAX ]; then
              echo "❌ Frontend no listo tras $((MAX*3))s — logs:"
              docker compose --env-file .env.e2e -f docker-compose.e2e.yml logs frontend_e2e
              exit 1
            fi
            sleep 3
          done
          echo "✅ Frontend listo — ng serve respondiendo en localhost:$FPORT"

      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: code/frontend
          browser: chrome
        env:
          CYPRESS_BASE_URL: http://localhost:${{ env.E2E_FRONTEND_PORT }}

      - name: Subir screenshots de Cypress
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: code/frontend/cypress/screenshots
          retention-days: 7

      - name: Bajar stack E2E
        if: always()
        run: docker compose --env-file .env.e2e -f docker-compose.e2e.yml down -v

  # ── Backend ────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Backend → Cloud Run prod
    runs-on: ubuntu-latest
    needs: [e2e]

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push backend image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_REPO }}/backend:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" -f docker/backend/Dockerfile code/backend
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: atreyu-backend
          region: ${{ env.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          image: ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_REPO }}/backend:${{ github.sha }}
          flags: --allow-unauthenticated
          env_vars: |
            SPRING_PROFILES_ACTIVE=prod
            SPRING_DATASOURCE_URL=${{ secrets.PROD_DB_URL }}
            SPRING_DATASOURCE_USERNAME=${{ secrets.PROD_DB_USERNAME }}
            SPRING_DATASOURCE_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
            SENTRY_DSN_BACKEND=${{ secrets.SENTRY_DSN_BACKEND }}

  # ── Frontend ───────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Frontend → Cloud Run prod
    runs-on: ubuntu-latest
    needs: [e2e]

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push frontend image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_REPO }}/frontend:${{ github.sha }}
        run: |
          docker build \
            --target prod \
            --build-arg SENTRY_DSN_FRONTEND=${{ secrets.SENTRY_DSN_FRONTEND }} \
            -t "$IMAGE" -f docker/frontend/Dockerfile .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: atreyu-frontend
          region: ${{ env.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          image: ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_REPO }}/frontend:${{ github.sha }}
          flags: --port=80 --allow-unauthenticated

  # ── Cleanup — revisiones Cloud Run e imágenes Artifact Registry ───────────
  cleanup:
    name: Cleanup — Cloud Run revisions + AR images
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]

    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Eliminar revisiones antiguas — backend
        run: |
          set -euo pipefail
          REVISIONS=$(gcloud run revisions list \
            --service=atreyu-backend \
            --region=${{ env.GCP_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --sort-by="~metadata.creationTimestamp" \
            --format="value(metadata.name)")
          OLD=$(echo "$REVISIONS" | tail -n +2)
          if [ -n "$OLD" ]; then
            echo "$OLD" | xargs -I{} gcloud run revisions delete {} \
              --region=${{ env.GCP_REGION }} \
              --project=${{ secrets.GCP_PROJECT_ID }} \
              --quiet
          else
            echo "No hay revisiones antiguas de backend que eliminar"
          fi

      - name: Eliminar revisiones antiguas — frontend
        run: |
          set -euo pipefail
          REVISIONS=$(gcloud run revisions list \
            --service=atreyu-frontend \
            --region=${{ env.GCP_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --sort-by="~metadata.creationTimestamp" \
            --format="value(metadata.name)")
          OLD=$(echo "$REVISIONS" | tail -n +2)
          if [ -n "$OLD" ]; then
            echo "$OLD" | xargs -I{} gcloud run revisions delete {} \
              --region=${{ env.GCP_REGION }} \
              --project=${{ secrets.GCP_PROJECT_ID }} \
              --quiet
          else
            echo "No hay revisiones antiguas de frontend que eliminar"
          fi

      - name: Eliminar imágenes antiguas de AR — backend
        run: |
          set -euo pipefail
          IMAGES=$(gcloud artifacts docker images list \
            "${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_REPO }}/backend" \
            --include-tags \
            --sort-by="~createTime" \
            --format="json")
          OLD=$(echo "$IMAGES" | jq -r '
            ( [.[] | select(.tags != null and (any(.tags[]; startswith("qa-")) | not))] | .[1:][] | .version ),
            ( .[] | select(.tags == null or (.tags | length == 0)) | .version )
          ' | sort -u)
          if [ -n "$OLD" ]; then
            while IFS= read -r digest; do
              gcloud artifacts docker images delete \
                "${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_REPO }}/backend@$digest" \
                --quiet --delete-tags
            done <<< "$OLD"
          else
            echo "No hay imágenes antiguas de backend en AR que eliminar"
          fi

      - name: Eliminar imágenes antiguas de AR — frontend
        run: |
          set -euo pipefail
          IMAGES=$(gcloud artifacts docker images list \
            "${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_REPO }}/frontend" \
            --include-tags \
            --sort-by="~createTime" \
            --format="json")
          OLD=$(echo "$IMAGES" | jq -r '
            ( [.[] | select(.tags != null and (any(.tags[]; startswith("qa-")) | not))] | .[1:][] | .version ),
            ( .[] | select(.tags == null or (.tags | length == 0)) | .version )
          ' | sort -u)
          if [ -n "$OLD" ]; then
            while IFS= read -r digest; do
              gcloud artifacts docker images delete \
                "${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_REPO }}/frontend@$digest" \
                --quiet --delete-tags
            done <<< "$OLD"
          else
            echo "No hay imágenes antiguas de frontend en AR que eliminar"
          fi
