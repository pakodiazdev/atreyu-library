# Este archivo es referencia/respaldo; el análisis activo usa sonar-maven-plugin (ver ci.yml).
# El Maven plugin lee las propiedades desde pom.xml <properties>, no desde este archivo.
sonar.projectKey=atreyu-library-backend
sonar.organization=pakodiazdev-1
sonar.projectName=Atreyu Library — Backend

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.exclusions=**/AtreyuLibraryApplication.java, **/seeder/BookSeeder.java

sonar.qualitygate.wait=true
