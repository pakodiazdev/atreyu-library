# QA profile — active in Cloud Run QA (SPRING_PROFILES_ACTIVE=qa)
# DB connection comes from environment variables; seeder runs on startup.
management.endpoint.health.show-details=when_authorized
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://qa01.atreyu-library.pakodiaz.dev}

# Flyway clean habilitado en QA — QaFlywayConfig hace clean+migrate en cada deploy
# para garantizar un entorno consistente sin importar qué rama se desplegó antes.
# En prod este flag permanece en true (valor por defecto de Flyway).
spring.flyway.clean-disabled=false

# Sentry
sentry.dsn=${SENTRY_DSN_BACKEND}
sentry.environment=qa
sentry.traces-sample-rate=0.0
