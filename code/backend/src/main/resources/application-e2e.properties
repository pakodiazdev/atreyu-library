# E2E profile — active only in the local E2E Docker Compose stack (SPRING_PROFILES_ACTIVE=e2e)
# DB connection comes from docker-compose.e2e.yml environment variables.
# This profile MUST NOT be activated in production, QA, or dev containers.

# Show SQL — helps diagnose test failures
spring.jpa.show-sql=true

# Actuator
management.endpoint.health.show-details=always

# CORS — allow the Angular dev server
app.cors.allowed-origins=http://localhost:4200
