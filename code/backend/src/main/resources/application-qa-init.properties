# Perfil qa-init — usado exclusivamente por el Cloud Run Job de migración+siembra en qa-deploy.yml.
# El grupo 'spring.profiles.group.qa-init=qa' en application.properties activa el perfil qa
# completo (CORS, Sentry, etc.). Aquí solo se añaden las propiedades exclusivas del job de init:
# Flyway clean habilitado y servidor web desactivado para que Spring arranque, ejecute
# Flyway + seeders y salga solo.
spring.flyway.clean-disabled=false
spring.main.web-application-type=none
