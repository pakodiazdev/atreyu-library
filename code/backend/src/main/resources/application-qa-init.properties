# Perfil qa-init — usado exclusivamente por el Cloud Run Job de migración+siembra en qa-deploy.yml.
# Activa el perfil qa completo (CORS, Sentry, etc.), habilita Flyway clean y desactiva el servidor web
# para que Spring arranque, ejecute Flyway + seeders y salga solo.
# El servicio Cloud Run usa SPRING_PROFILES_ACTIVE=qa y SPRING_FLYWAY_ENABLED=false.
spring.profiles.include=qa
spring.flyway.clean-disabled=false
spring.main.web-application-type=none
