# Perfil prod-init — usado exclusivamente por el Cloud Run Job de migración+siembra en cd.yml.
# El grupo 'spring.profiles.group.prod-init=prod' en application.properties activa el perfil
# prod completo (CORS, Hikari, Sentry, etc.). Aquí solo se desactiva el servidor web para que
# Spring arranque, ejecute Flyway migrate + seeders y salga solo.
spring.main.web-application-type=none
