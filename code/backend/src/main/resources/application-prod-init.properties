# Perfil prod-init — usado exclusivamente por el Cloud Run Job de migración+siembra en cd.yml.
# El grupo 'spring.profiles.group.prod-init=prod' en application.properties activa el perfil
# prod completo (CORS, Hikari, Sentry, etc.).
# SPRING_MAIN_WEB_APPLICATION_TYPE=none se pasa como env var en el workflow (más confiable que
# configurarlo aquí, ya que Spring evalúa spring.main.* antes de cargar los profiles específicos).
