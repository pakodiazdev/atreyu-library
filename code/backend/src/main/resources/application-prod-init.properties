# Perfil prod-init — usado exclusivamente por el Cloud Run Job de migración+siembra en cd.yml.
# Activa el perfil prod completo (CORS, Hikari, Sentry, etc.) y desactiva el servidor web
# para que Spring arranque, ejecute Flyway migrate + seeders y salga solo.
# El servicio Cloud Run usa SPRING_PROFILES_ACTIVE=prod y SPRING_FLYWAY_ENABLED=false.
spring.profiles.include=prod
spring.main.web-application-type=none
