spring.application.name=AtreyuLibrary

# DataSource — must be provided via environment variables; no defaults to avoid weak credentials in production
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA — Flyway manages the schema; Hibernate never modifies it
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway — runs migrations from db/migration on every startup
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=${ACTUATOR_SHOW_DETAILS:when_authorized}

# El API nunca debe indexarse — el frontend de producción sí; el de QA se excluye vía nginx
app.security.no-index=true

# Sentry — disabled by default; qa and prod profiles override with their DSN
sentry.dsn=
