# Production profile — active in Cloud Run prod (SPRING_PROFILES_ACTIVE=prod)
# Conexión a BD viene de variables de entorno; BookSeederProd activo en prod para datos iniciales.
management.endpoint.health.show-details=never
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://atreyu-library.pakodiaz.dev}

# Hikari — socketTimeout evita que conexiones muertas (ej. Supabase timeout) se cuelguen sin lanzar excepción
spring.datasource.hikari.data-source-properties.socketTimeout=60
spring.datasource.hikari.keepalive-time=30000

# Sentry
sentry.dsn=${SENTRY_DSN_BACKEND}
sentry.environment=prod
sentry.traces-sample-rate=0.0
