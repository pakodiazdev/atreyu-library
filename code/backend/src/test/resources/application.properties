# Test profile — overrides application.properties for unit/integration tests.
# Uses H2 in-memory database so tests run without an external PostgreSQL instance.
# Flyway is disabled: schema is created by Hibernate (ddl-auto=create-drop) for the test run.
# This keeps CI fast and dependency-free; Testcontainers will be used for full integration tests (Issue #4).

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.flyway.enabled=false
