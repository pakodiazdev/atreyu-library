<aside class="hidden md:flex flex-col h-full w-60 bg-tinta text-papel shrink-0">

  <!-- Brand -->
  <div class="px-6 py-5 border-b border-tinta/20">
    <span class="font-editorial text-xl text-oro leading-tight">Atreyu</span>
    <span class="block text-xs text-papel/50 font-ui tracking-widest uppercase mt-0.5">biblioteca</span>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 py-4 overflow-y-auto">
    <ul class="space-y-0.5 px-3">
      @for (item of navItems; track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-oro/20 text-oro"
            class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm font-ui text-papel/70
                   hover:bg-papel/10 hover:text-papel transition-colors duration-150"
          >
            <span class="text-base w-5 text-center shrink-0" aria-hidden="true">{{ item.icon }}</span>
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <!-- Footer -->
  <div class="px-6 py-4 border-t border-papel/10">
    <span class="text-xs text-papel/30 font-code">v0.1.0-alpha</span>
  </div>

</aside>
