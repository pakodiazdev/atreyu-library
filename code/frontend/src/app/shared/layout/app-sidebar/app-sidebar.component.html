<aside class="hidden md:flex flex-col h-full w-[200px] bg-tinte border-r border-tinta shrink-0">

  <!-- Marca -->
  <div class="px-4 pt-5 pb-[18px]">
    <div class="font-editorial text-[22px] text-tinta leading-none">
      Atreyu
      <span class="block font-annotation text-[18px] text-oro-oscuro">biblioteca</span>
    </div>
  </div>

  <!-- Navegación -->
  <nav class="flex flex-col gap-1 px-[14px] pb-4 overflow-y-auto">
    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="!bg-tinta !text-papel-claro"
        class="flex items-center gap-2 px-[10px] py-[7px] rounded-md font-ui text-[15px] text-tinta-suave
               hover:bg-tinta/10 transition-colors duration-150"
      >
        <span class="text-base w-5 text-center shrink-0" aria-hidden="true">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <!-- Footer -->
  <div class="mt-auto px-[14px] pb-4">
    <div class="border-t border-dashed border-tinta/40 mb-2"></div>
    <div class="flex items-center gap-2 px-[10px] py-[7px] rounded-md font-ui text-[15px] text-tinta-suave">
      <span class="text-base w-5 text-center shrink-0" aria-hidden="true">👤</span>
      <span>Bibliotecario</span>
    </div>
  </div>

</aside>
