<!-- Shell: sidebar fijo + área principal -->
<div class="flex h-screen overflow-hidden bg-papel">

  <!-- Backdrop móvil — visible solo cuando sidebar abierto -->
  @if (sidebarOpen()) {
    <div
      data-cy="sidebar-backdrop"
      class="fixed inset-y-0 right-0 left-[200px] z-20 bg-black/40 md:hidden"
      (click)="closeSidebar()"
      aria-hidden="true"
    ></div>
  }

  <!-- Sidebar -->
  <app-sidebar [isOpen]="sidebarOpen()" (closed)="closeSidebar()" />

  <!-- Área principal -->
  <div class="flex flex-col flex-1 min-w-0 overflow-hidden">

    <!-- Header móvil -->
    <app-header (burgerToggle)="toggleSidebar()" />

    <!-- Contenido de la ruta activa -->
    <main class="flex-1 overflow-y-auto p-6">
      <router-outlet />
    </main>

  </div>

</div>

<!-- Drawer global — disponible en cualquier ruta -->
<ui-drawer
  [isOpen]="drawer.isOpen()"
  [title]="drawerTitle()"
  (closed)="closeDrawer()"
  data-cy="global-drawer"
>
  <!--
    Contenedor de paneles deslizantes. Ocupa toda el área del body del drawer
    (h-full dentro del flex-1 del panel). Cada panel es absoluto y se desplaza
    con translate-x según el modo activo, produciendo la transición detail ↔ form.
  -->
  <div class="relative h-full">

    <!-- Panel de detalle: fade in en 'detail', fade out en edit/form -->
    <div
      class="absolute inset-0 overflow-y-auto transition-opacity duration-300 ease-in-out"
      [class.opacity-100]="drawer.mode() === 'detail'"
      [class.opacity-0]  ="drawer.mode() === 'edit' || drawer.mode() === 'form' || !drawer.mode()"
      [class.pointer-events-none]="drawer.mode() !== 'detail'"
      data-cy="drawer-panel-detail"
    >
      @if (drawer.bookCode()) {
        <app-book-detail [bookCode]="drawer.bookCode()!" />
      }
    </div>

    <!-- Panel de formulario: fade in en 'form'/'edit', fade out en detail -->
    <div
      class="absolute inset-0 overflow-y-auto transition-opacity duration-300 ease-in-out"
      [class.opacity-100]="drawer.mode() === 'form' || drawer.mode() === 'edit'"
      [class.opacity-0]  ="drawer.mode() === 'detail' || !drawer.mode()"
      [class.pointer-events-none]="drawer.mode() !== 'form' && drawer.mode() !== 'edit'"
      data-cy="drawer-panel-form"
    >
      @if (drawer.mode() === 'form' || drawer.mode() === 'edit') {
        <app-book-form
          [bookCode]="drawer.mode() === 'edit' ? drawer.bookCode() : null"
        />
      }
    </div>

  </div>
</ui-drawer>

<!-- Toast global — feedback de acciones -->
<ui-toast />

<!-- Dialog global — para confirmaciones destructivas -->
<ui-dialog
  [isOpen]="dialog.isOpen()"
  [title]="dialog.mode() === 'book-delete' ? 'Eliminar libro' : undefined"
  (closed)="closeDialog()"
  data-cy="global-dialog"
>
  @if (dialog.mode() === 'book-delete') {
    <app-book-delete-form />
  }
</ui-dialog>
