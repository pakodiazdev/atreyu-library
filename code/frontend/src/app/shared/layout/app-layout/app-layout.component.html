<!-- Shell: sidebar fijo + área principal -->
<div class="flex h-screen overflow-hidden bg-papel">

  <!-- Backdrop móvil — visible solo cuando sidebar abierto -->
  @if (sidebarOpen()) {
    <div
      data-cy="sidebar-backdrop"
      class="fixed inset-y-0 right-0 left-[200px] z-20 bg-black/40 md:hidden"
      (click)="closeSidebar()"
      aria-hidden="true"
    ></div>
  }

  <!-- Sidebar -->
  <app-sidebar [isOpen]="sidebarOpen()" (closed)="closeSidebar()" />

  <!-- Área principal -->
  <div class="flex flex-col flex-1 min-w-0 overflow-hidden">

    <!-- Header móvil -->
    <app-header (burgerToggle)="toggleSidebar()" />

    <!-- Contenido de la ruta activa -->
    <main class="flex-1 overflow-y-auto p-6">
      <router-outlet />
    </main>

  </div>

</div>

<!-- Drawer global — disponible en cualquier ruta -->
<ui-drawer
  [isOpen]="drawer.isOpen()"
  [title]="drawerTitle()"
  (closed)="closeDrawer()"
  data-cy="global-drawer"
>
  <!--
    Contenedor de paneles deslizantes. Ocupa toda el área del body del drawer
    (h-full dentro del flex-1 del panel). Cada panel es absoluto y se desplaza
    con translate-x según el modo activo, produciendo la transición detail ↔ form.
  -->
  <div class="relative h-full overflow-hidden">

    <!-- Panel de detalle: visible en 'detail', sale por la izquierda en 'edit' -->
    <div
      class="absolute inset-0 overflow-y-auto transition-transform duration-300 ease-in-out"
      [class.translate-x-0]=  "drawer.mode() === 'detail'"
      [class.-translate-x-full]="drawer.mode() === 'edit'"
      [class.translate-x-full]= "drawer.mode() === 'form' || !drawer.mode()"
      data-cy="drawer-panel-detail"
    >
      @if (drawer.bookCode()) {
        <app-book-detail [bookCode]="drawer.bookCode()!" />
      }
    </div>

    <!-- Panel de formulario: visible en 'form' y 'edit', entra por la derecha -->
    <div
      class="absolute inset-0 overflow-y-auto transition-transform duration-300 ease-in-out"
      [class.translate-x-0]=  "drawer.mode() === 'form' || drawer.mode() === 'edit'"
      [class.translate-x-full]="drawer.mode() === 'detail' || !drawer.mode()"
      data-cy="drawer-panel-form"
    >
      <app-book-form
        [bookCode]="drawer.mode() === 'edit' ? drawer.bookCode() : null"
      />
    </div>

  </div>
</ui-drawer>
