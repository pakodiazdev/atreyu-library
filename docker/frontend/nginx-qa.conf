server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # QA: autenticación básica requerida en todas las rutas
    auth_basic "QA Environment";
    auth_basic_user_file /etc/nginx/.htpasswd;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # robots.txt público para que los crawlers lean el Disallow sin necesitar credenciales
    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # index.html — sin caché; add_header en el bloque hijo no hereda del padre, se repite X-Robots-Tag
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash de contenido (JS, CSS, fuentes) — caché inmutable
    location ~* \.(?:css|js|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Assets sin hash (imágenes, favicon) — caché de una semana
    location ~* \.(?:ico|gif|jpe?g|png)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
